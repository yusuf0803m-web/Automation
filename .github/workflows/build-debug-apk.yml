# Builds the Pelita Auto Continue debug APK on CI.
#
# This exists because the Android Gradle Plugin, AndroidX and the Android SDK
# all live on Google's Maven repository, which is not reachable from every
# development environment. GitHub's runners can reach it, so the APK is built
# here instead.
#
# Manual trigger only for now: this does not run on push.
#
# GitHub only offers the "Run workflow" button for workflows that exist on the
# repository's default branch, which here is claude/pelita-auto-continue-ofp646.

name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test core and assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate the Android SDK
        # The runner image already ships the Android SDK and sets ANDROID_HOME,
        # so no third-party setup action is needed. android-actions/setup-android
        # was used here before and failed: its default package list includes the
        # obsolete "tools" package, which no longer exists in the SDK repository
        # ("Warning: Failed to find package 'tools'").
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set on this runner image." >&2
            exit 1
          fi
          # Prefer cmdline-tools/latest when present, else the highest version.
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -n 1)"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdkmanager   =$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        # Non-interactive. A fixed run of "y" lines is used rather than `yes`:
        # it fits in the pipe buffer and exits 0, so this cannot fail on
        # SIGPIPE if the shell is ever switched to one with `pipefail` set.
        run: printf 'y\n%.0s' $(seq 100) | "$SDKMANAGER" --licenses > /dev/null

      - name: Install the Android SDK packages this build needs
        # compileSdk = 35 and AGP 8.7.3, per app/build.gradle.kts.
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run the core unit tests
        id: core_tests
        # `shell: bash` turns on pipefail, so the tee does not mask a failure.
        shell: bash
        run: ./gradlew :core:test --no-daemon --console=plain 2>&1 | tee core-test.log

      - name: Assemble the debug APK
        id: assemble
        # -PincludeApp=true makes settings.gradle.kts include the :app module.
        # ANDROID_HOME alone would already do it on this runner; passing the
        # flag keeps the step correct regardless of the runner image.
        shell: bash
        run: |
          ./gradlew :app:assembleDebug -PincludeApp=true --no-daemon --console=plain 2>&1 \
            | tee assemble.log

      - name: Summarise the Gradle failure
        # Gradle's own output is thousands of lines; this pulls out just the
        # compiler errors and the "What went wrong" block so a failed run can
        # be diagnosed from the step summary alone.
        if: failure()
        shell: bash
        run: |
          for log in core-test.log assemble.log; do
            [ -f "$log" ] || continue
            echo "### $log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -nE '^(e: |w: |FAILURE:|\* What went wrong|\* Where|\* Try|Caused by:|> )' "$log" \
              | head -60 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "===== $log ====="
            grep -nE '^(e: |w: |FAILURE:|\* What went wrong|\* Where|\* Try|Caused by:|> )' "$log" \
              | head -60 || true
          done

      - name: Upload the raw Gradle logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pelita-auto-continue-gradle-logs
          path: |
            core-test.log
            assemble.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pelita-auto-continue-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload the core test reports
        # Runs even when the tests failed - that is when the report is most
        # useful. It does not resurrect a failed job.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pelita-auto-continue-core-test-reports
          path: |
            core/build/reports/tests/test
            core/build/test-results/test
          if-no-files-found: ignore
          retention-days: 30
